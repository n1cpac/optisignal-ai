# To use Blender live, set a source to the OBS Virtual Camera index.
# electrico and falla are placeholders until Blender publishes the simulated state.
semaforos:
  - {id: s1, nombre: "AC 13 con CL 13", lat: 4.60357, lng: -74.07992, electrico: rojo, falla: false,
     source: "frontend/smaforos blender/images/img_00000.png"}
