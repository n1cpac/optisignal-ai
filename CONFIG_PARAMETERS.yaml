# ============================================================================
# DATABASE CONFIGURATION (SQLite)
# ============================================================================
database:
  path: "./data/optisignal.db"
  backup_path: "./data/backups/"
  evidence_storage_path: "./data/evidence/"
  max_evidence_size_mb: 5000         # Maximum storage for evidence images
  retention_days: 90                 # Keep records for 90 days

# ============================================================================
# API AND FRONTEND COMMUNICATION
# ============================================================================
api:
  host: "0.0.0.0"
  port: 8000
  update_interval_ms: 1000           # Frontend polling interval
  max_alerts_per_response: 100       # Limit alerts in API response
  cors_origins:
    - "http://localhost:4200"
    - "http://localhost:80"

# ============================================================================
# LOGGING AND MONITORING
# ============================================================================
logging:
  level: "INFO"                      # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_file: "./logs/optisignal.log"
  max_log_size_mb: 100
  backup_count: 5
  console_output: true

monitoring:
  track_fps: true
  track_inference_time: true
  track_memory_usage: true
  performance_log_interval_seconds: 60

# ============================================================================
# SYSTEM HEALTH AND RECOVERY
# ============================================================================
system:
  startup_delay_seconds: 2           # Delay before processing starts
  recovery_timeout_seconds: 10       # Time to wait before recovery attempt
  max_recovery_attempts: 3           # Maximum recovery attempts
  graceful_shutdown_timeout_seconds: 5

# ============================================================================
# DEVELOPMENT AND TESTING
# ============================================================================
development:
  debug_mode: false
  save_debug_frames: false           # Save frames with detections for debugging
  debug_output_path: "./debug/"
  simulate_anomalies: false          # For testing purposes
  test_mode: false
