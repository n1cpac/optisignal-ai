detector:
  model_path: models/lisa_best.pt
  inference_interval_seconds: 0.25
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: cpu
  inference_timeout_ms: 35
  input_size: 640
color_classification:
  red:
    hue_ranges:
    - - 0
      - 9
    - - 170
      - 179
    saturation_min: 15
    brightness_min: 120
  yellow:
    hue_ranges:
    - - 17
      - 40
    saturation_min: 15
    brightness_min: 120
  green:
    hue_ranges:
    - - 50
      - 90
    saturation_min: 15
    brightness_min: 120
  activation_threshold: 0.05
  min_roi_height: 12
traffic_light_timing:
  red_min: 30
  yellow_prep_min: 3
  green_min: 20
  yellow_desp_min: 3
  red_max: 120
  yellow_prep_max: 5
  green_max: 90
  yellow_desp_max: 5
  yellow_prep_duration: 3
  yellow_desp_duration: 3
anomaly_detection:
  confirmation_frames: 8
  fps: 30
  confirmation_time_ms: 267
  all_lights_off:
    pixel_threshold: 0.05
    confirmation_frames: 8
  multiple_lights_on:
    min_lights_active: 2
    confirmation_frames: 8
  invalid_transition:
    confirmation_frames: 8
  light_stuck:
    confirmation_frames: 8
  low_brightness:
    brightness_threshold: 100
    confirmation_frames: 8
  obstructed_light:
    dark_pixel_threshold: 0.8
    confirmation_frames: 8
camera:
  source: 0
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  frame_buffer_size: 5
  timeout_seconds: 5
