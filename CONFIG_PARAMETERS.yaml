detector:
  ensemble: true
  model_paths:
    - models/blender_best.pt  # 3D renders del frontend + Bogotá local (87.5% de acierto en front)
    - models/lisa_best.pt     # Semáforos reales diversos (alta sensibilidad a video real)
    - models/bosch_best.pt    # Semáforos urbanos alta resolución
  model_path: models/blender_best.pt  # Fallback si ensemble está desactivado
  inference_interval_seconds: 0.25
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: cpu
  inference_timeout_ms: 35
  input_size: 640
color_classification:
  red:
    hue_ranges:
    - - 0
      - 9
    - - 170
      - 179
    saturation_min: 15
    brightness_min: 120
  yellow:
    hue_ranges:
    - - 17
      - 40
    saturation_min: 15
    brightness_min: 120
  green:
    hue_ranges:
    - - 50
      - 90
    saturation_min: 15
    brightness_min: 120
  activation_threshold: 0.05
  min_roi_height: 12
traffic_light_timing:
  red_min: 30
  yellow_prep_min: 3
  green_min: 20
  yellow_desp_min: 3
  red_max: 120
  yellow_prep_max: 5
  green_max: 90
  yellow_desp_max: 5
  yellow_prep_duration: 3
  yellow_desp_duration: 3
anomaly_detection:
  # A new light state counts only after holding this long (filters flicker and one-frame errors).
  state_confirmation_seconds: 1.0
  # Losing sight of the light longer than this skips the next transition check. Keep
  # state_confirmation_seconds + resync_after_seconds <= yellow_*_min, so a yellow is either
  # confirmed or treated as lost from view.
  resync_after_seconds: 2.0
  # A traffic light sends one alert per scene. It alerts again only when the scene changes
  # (mean gray difference of a 32x18 thumbnail above this) or as a reminder when its last alert
  # has gone this long without being opened in the panel. Measured: a light change in the same
  # Blender scene < 1, static OBS 0, distinct renders median 63. Real cameras reach ~11 from
  # exposure changes alone: raise this to ~15 for them.
  alert_new_scene_threshold: 3.0
  alert_reminder_minutes: 30
  all_lights_off:
    pixel_threshold: 0.05
    confirmation_frames: 8
  multiple_lights_on:
    min_lights_active: 2
    confirmation_frames: 8
  invalid_transition:
    confirmation_frames: 8
  light_stuck:
    confirmation_frames: 8
  low_brightness:
    brightness_threshold: 100
    confirmation_frames: 8
  obstructed_light:
    dark_pixel_threshold: 0.8
    confirmation_frames: 8
camera:
  source: 0
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  frame_buffer_size: 5
  timeout_seconds: 5
semaforos:
# s1 is the only camera. A folder source takes a random render on every backend start;
# its electrical state and fault come from the file name (scenario_NN_time_lights.png).
- id: s1
  nombre: AC 13 con CL 13
  lat: 4.60357
  lng: -74.07992
  electrico: rojo
  falla: false
  source: data/test_videos/test1.mp4
- id: s2
  nombre: AC 72 con KR 13
  lat: 4.65843
  lng: -74.06038
  source: frontend/smaforos blender/renders_escenarios
- id: s3
  nombre: AK 7 con CL 117
  lat: 4.69469
  lng: -74.03265
  source: frontend/smaforos blender/renders_escenarios
- id: s4
  nombre: AC 145 con KR 96
  lat: 4.74077
  lng: -74.08894
  source: frontend/smaforos blender/renders_escenarios
- id: s5
  nombre: AC 63 con KR 103A
  lat: 4.69513
  lng: -74.12479
  source: frontend/smaforos blender/renders_escenarios
- id: s6
  nombre: AK 97 con CL 16I
  lat: 4.66986
  lng: -74.14509
  source: frontend/smaforos blender/renders_escenarios
- id: s7
  nombre: AC 6 con TV 78C
  lat: 4.6323
  lng: -74.14954
  source: frontend/smaforos blender/renders_escenarios
- id: s8
  nombre: AK 80 con CL 59 S
  lat: 4.60866
  lng: -74.18121
  source: frontend/smaforos blender/renders_escenarios
# A history report shows one of these renders instead of the live camera (fixed per report)
history_scenes: frontend/smaforos blender/renders_escenarios
database:
  path: ./data/optisignal.db
  backup_path: ./data/backups/
  evidence_storage_path: ./data/evidence/
  max_evidence_size_mb: 5000
  retention_days: 90
api:
  host: 0.0.0.0
  port: 8000
  update_interval_ms: 1000
  max_alerts_per_response: 100
  cors_origins:
  - http://localhost:4200
  - http://localhost:80
logging:
  level: INFO
  log_file: ./logs/optisignal.log
  max_log_size_mb: 100
  backup_count: 5
  console_output: true
monitoring:
  track_fps: true
  track_inference_time: true
  track_memory_usage: true
  performance_log_interval_seconds: 60
system:
  startup_delay_seconds: 2
  recovery_timeout_seconds: 10
  max_recovery_attempts: 3
  graceful_shutdown_timeout_seconds: 5
development:
  debug_mode: false
  save_debug_frames: false
  debug_output_path: ./debug/
  simulate_anomalies: false
  test_mode: false
