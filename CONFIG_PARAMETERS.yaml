# Configuration Parameters for OptiSignal-AI
# This file centralizes all tunable parameters for the traffic light detection system

# ============================================================================
# YOLO DETECTOR CONFIGURATION
# ============================================================================
detector:
  model_path: "models/lisa_best.pt"  # Beat bosch_best.pt on the Blender renders (9/20 vs 2/20)
  inference_interval_seconds: 0.25   # Time per round over all cameras
  confidence_threshold: 0.5          # Minimum confidence for detection
  iou_threshold: 0.45                # IoU threshold for NMS
  device: "cpu"                      # 'cpu' or 'cuda' (GPU)
  inference_timeout_ms: 35           # Maximum inference time per frame
  input_size: 640                    # YOLO input resolution

# ============================================================================
# COLOR CLASSIFICATION (HSV THRESHOLDS)
# ============================================================================
color_classification:
  # Calibrated on the Blender renders: lit lenses are overexposed (pastel, S around 20-60),
  # so saturation must stay low. Hue 10-16 stays out on purpose: housings lit by
  # sunset light sit at H=12 and would read as a lit lens.

  # RED light thresholds (HSV space)
  red:
    hue_ranges: [[0, 9], [170, 179]] # Red wraps around the hue circle (0-179 in OpenCV)
    saturation_min: 15               # Minimum saturation (0-255)
    brightness_min: 120              # Minimum brightness/Value (0-255)

  # YELLOW light thresholds (HSV space)
  yellow:
    hue_ranges: [[17, 40]]           # Hue range for yellow
    saturation_min: 15               # Minimum saturation
    brightness_min: 120              # Minimum brightness/Value

  # GREEN light thresholds (HSV space)
  green:
    hue_ranges: [[50, 90]]           # Hue range for green
    saturation_min: 15               # Minimum saturation
    brightness_min: 120              # Minimum brightness/Value

  # General thresholds
  activation_threshold: 0.05         # theta_act: fraction of a lens zone's pixels to consider it ON
  min_roi_height: 12                 # Below this, thirds are too small to read: state is UNKNOWN

# ============================================================================
# TRAFFIC LIGHT SEQUENCE TIMING (COLOMBIAN STANDARD)
# ============================================================================
traffic_light_timing:
  # Minimum duration for each state (seconds)
  red_min: 30
  yellow_prep_min: 3
  green_min: 20
  yellow_desp_min: 3

  # Maximum duration for each state (seconds) - tau_max
  red_max: 120
  yellow_prep_max: 5
  green_max: 90
  yellow_desp_max: 5

  # Phase type identification
  yellow_prep_duration: 3            # Expected duration of preparation yellow
  yellow_desp_duration: 3            # Expected duration of despeje yellow

# ============================================================================
# ANOMALY DETECTION PARAMETERS
# ============================================================================
anomaly_detection:
  # Confirmation window: minimum consecutive frames to confirm anomaly
  confirmation_frames: 8             # N: frames required to confirm anomaly
  fps: 30                            # Frames per second (for time calculations)
  confirmation_time_ms: 267          # ~8 frames / 30 FPS = 0.267 seconds

  # Anomaly-specific thresholds
  all_lights_off:
    pixel_threshold: 0.05            # All lights below this threshold
    confirmation_frames: 8

  multiple_lights_on:
    min_lights_active: 2             # Number of lights active simultaneously
    confirmation_frames: 8

  invalid_transition:
    confirmation_frames: 8

  light_stuck:
    confirmation_frames: 8           # Frames after exceeding tau_max

  low_brightness:
    brightness_threshold: 100        # V_min: minimum brightness
    confirmation_frames: 8

  obstructed_light:
    dark_pixel_threshold: 0.80       # % of dark pixels (V < 50) to consider obstructed
    confirmation_frames: 8

# ============================================================================
# CAMERA AND VIDEO INPUT
# ============================================================================
camera:
  source: 0                          # 0 for webcam, or path to video file
  resolution_width: 1280
  resolution_height: 720
  fps: 30
  frame_buffer_size: 5               # Number of frames to buffer
  timeout_seconds: 5                 # Timeout for camera connection

# ============================================================================
# MONITORED TRAFFIC LIGHTS
